<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentinel IA — Tela de Bloqueio & Autenticação</title>
  <meta name="description" content="Tela de Bloqueio e Login do Sentinel IA - Plataforma de Inteligência Preditiva Urbana.">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css?v=3">
  <link rel="stylesheet" href="css/dashboard.css?v=3">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">

  <!-- Auth Script (Primeira checagem no HEAD) -->
  <script src="js/auth.js"></script>

  <style>
    body {
      background: var(--bg-primary, #060a14);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      font-family: var(--font-main, 'Inter', sans-serif);
      overflow-x: hidden;
      position: relative;
    }

    /* Fundo Tecnológico de Grade Cyberpunk */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 50% 30%, rgba(0, 229, 255, 0.15), transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.12), transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .login-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      padding: 1.5rem;
    }

    .login-card {
      background: rgba(10, 16, 30, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-hover, rgba(0, 229, 255, 0.25));
      border-radius: var(--radius-lg, 16px);
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 229, 255, 0.1);
      animation: fadeIn 0.4s ease;
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: var(--gradient-main, linear-gradient(135deg, #00e5ff 0%, #a855f7 100%));
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
      color: #060a14;
    }

    .login-header h2 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #fff;
      margin: 0 0 0.4rem;
    }

    .login-header p {
      font-size: 0.85rem;
      color: var(--text-tertiary, #8b9dc3);
      margin: 0;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary, #cbd5e1);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-input-wrap i {
      position: absolute;
      left: 14px;
      color: var(--text-tertiary, #8b9dc3);
      width: 18px;
      height: 18px;
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 0.75rem 0.875rem 0.75rem 2.6rem;
      color: #fff;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--cyan, #00e5ff);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.25);
      background: rgba(0, 229, 255, 0.03);
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      font-size: 0.82rem;
      color: var(--text-secondary, #cbd5e1);
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
    }

    .remember-me input {
      accent-color: var(--cyan, #00e5ff);
    }

    .btn-login {
      width: 100%;
      background: var(--gradient-main, linear-gradient(135deg, #00e5ff 0%, #a855f7 100%));
      color: #060a14;
      border: none;
      border-radius: 10px;
      padding: 0.85rem;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(0, 229, 255, 0.3);
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 229, 255, 0.5);
    }

    .btn-quick-access {
      width: 100%;
      margin-top: 0.75rem;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-secondary, #cbd5e1);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 0.65rem;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-quick-access:hover {
      background: rgba(0, 229, 255, 0.1);
      color: var(--cyan, #00e5ff);
      border-color: var(--cyan, #00e5ff);
    }

    .login-error-msg {
      display: none;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #ef4444;
      padding: 0.65rem;
      border-radius: 8px;
      font-size: 0.82rem;
      margin-bottom: 1.25rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <i data-lucide="shield-check" style="width:32px;height:32px;"></i>
        </div>
        <h2>Sentinel <span style="color: var(--cyan, #00e5ff);">IA</span></h2>
        <p>Sistema de Inteligência Preditiva Urbana — Acesso Restrito</p>
      </div>

      <!-- Alerta de Erro -->
      <div class="login-error-msg" id="loginErrorMsg"></div>

      <!-- Formulário de Login -->
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="usernameInput">Usuário / E-mail</label>
          <div class="form-input-wrap">
            <i data-lucide="user"></i>
            <input type="text" id="usernameInput" class="form-input" placeholder="Digite seu usuário..." required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="passwordInput">Senha de Acesso</label>
          <div class="form-input-wrap">
            <i data-lucide="lock"></i>
            <input type="password" id="passwordInput" class="form-input" placeholder="Digite sua senha..." required />
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMeInput" checked />
            Lembrar-me neste navegador
          </label>
        </div>

        <button type="submit" class="btn-login">
          <i data-lucide="key-round" style="width:18px;height:18px;"></i>
          Entrar no Sistema
        </button>

        <button type="button" class="btn-quick-access" id="btnQuickAccess">
          🚀 Acesso Rápido de Teste (Admin)
        </button>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();

    const form = document.getElementById('loginForm');
    const usernameInput = document.getElementById('usernameInput');
    const passwordInput = document.getElementById('passwordInput');
    const rememberMeInput = document.getElementById('rememberMeInput');
    const errorMsg = document.getElementById('loginErrorMsg');
    const quickBtn = document.getElementById('btnQuickAccess');

    function executeLogin(user, pass, remember) {
      const res = window.sentinelLogin(user, pass, remember);
      if (res.success) {
        window.location.href = 'dashboard.html';
      } else {
        errorMsg.textContent = res.message;
        errorMsg.style.display = 'block';
      }
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      executeLogin(usernameInput.value, passwordInput.value, rememberMeInput.checked);
    });

    quickBtn.addEventListener('click', function () {
      usernameInput.value = 'admin@sentinel.ia';
      passwordInput.value = 'admin123';
      executeLogin('admin@sentinel.ia', 'admin123', true);
    });
  </script>
</body>
</html>
